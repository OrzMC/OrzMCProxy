name: verify-configs
# 每次 push/PR 校验 frps/frpc 配置模板语法（frp 官方 verify 命令）

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载 frp v0.70.1 (linux amd64)
        run: |
          curl -fL -o frp.tar.gz https://github.com/fatedier/frp/releases/download/v0.70.1/frp_0.70.1_linux_amd64.tar.gz
          tar -xzf frp.tar.gz
          mv frp_*/frps frp_*/frpc .

      - name: 校验 frps.toml.example
        run: ./frps verify -c configs/frps.toml.example

      - name: 校验 frpc.toml.example
        run: ./frpc verify -c configs/frpc.toml.example

      - name: 校验 shell 脚本语法（Linux 目标端）
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
          echo "✅ 所有 .sh 语法通过"

      - name: 校验 PowerShell 脚本语法（Parser 只解析不执行）
        shell: pwsh
        run: |
          $files = @("scripts/install-frp.ps1", "scripts/uninstall-frp.ps1")
          foreach ($f in $files) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "❌ $f 语法错误:"
              $errors | ForEach-Object { Write-Host $_.Message }
              exit 1
            }
            Write-Host "✅ $f 语法通过"
          }

      - name: Linux 多实例安装测试（SKIP_SERVICE=1 跳过 systemd 注册）
        run: |
          export SKIP_SERVICE=1
          sudo bash scripts/install-frp.sh frpc
          sudo bash scripts/install-frp.sh frpc relay-b
          echo "--- 生成的配置 ---"
          ls -la /etc/orzmcproxy/
          test -f /usr/local/bin/frpc || { echo "❌ 缺共享二进制"; exit 1; }
          test -f /etc/orzmcproxy/frpc-default.toml || { echo "❌ 缺 frpc-default.toml"; exit 1; }
          test -f /etc/orzmcproxy/frpc-relay-b.toml || { echo "❌ 缺 frpc-relay-b.toml"; exit 1; }
          grep -q "frpc-default" /etc/orzmcproxy/frpc-default.toml || { echo "❌ 配置串扰 default"; exit 1; }
          grep -q "frpc-relay-b" /etc/orzmcproxy/frpc-relay-b.toml || { echo "❌ 配置串扰 relay-b"; exit 1; }
          # 幂等：重复安装不覆盖已有配置
          echo "CHANGE_ME_RELAY_IP" > /tmp/marker
          sudo bash scripts/install-frp.sh frpc >/dev/null 2>&1
          grep -q "CHANGE_ME_RELAY_IP" /etc/orzmcproxy/frpc-default.toml && echo "✅ 幂等验证通过（配置未被覆盖）"
          echo "✅ Linux 多实例验证通过（二进制共享 + 配置隔离 + 幂等）"

  windows-install-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 default 实例
        shell: pwsh
        run: .\scripts\install-frp.ps1 -Role frpc

      - name: 安装第二实例（多中转机场景）
        shell: pwsh
        run: .\scripts\install-frp.ps1 -Role frpc -Name relay-b

      - name: 验证两个计划任务已注册
        shell: pwsh
        run: |
          $tasks = Get-ScheduledTask -TaskName "OrzMCProxy-frpc-default", "OrzMCProxy-frpc-relay-b"
          $tasks | Select-Object TaskName, State | Format-Table
          if ($tasks.Count -ne 2) { exit 1 }

      - name: 验证配置按实例隔离 + 二进制共享
        shell: pwsh
        run: |
          $dir = "C:\Program Files\OrzMCProxy"
          if (-not (Test-Path "$dir\frpc-default.toml")) { Write-Error "缺 frpc-default.toml"; exit 1 }
          if (-not (Test-Path "$dir\frpc-relay-b.toml")) { Write-Error "缺 frpc-relay-b.toml"; exit 1 }
          if (-not (Test-Path "$dir\frpc.exe")) { Write-Error "缺共享二进制 frpc.exe"; exit 1 }
          # 两个配置的日志路径必须隔离
          $c1 = Get-Content "$dir\frpc-default.toml" -Raw
          $c2 = Get-Content "$dir\frpc-relay-b.toml" -Raw
          if ($c1 -match "frpc-relay-b") { Write-Error "配置串扰"; exit 1 }
          Write-Host "✅ 多实例安装验证通过（二进制共享 + 配置/日志隔离 + 双任务注册）"
